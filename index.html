<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absensi OSIS - Liveness Detection</title>
    <!-- Tailwind CSS untuk styling modern -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-md bg-slate-800 p-6 rounded-2xl shadow-xl border border-slate-700">
        <h2 class="text-2xl font-bold text-center mb-2 text-cyan-400">Absensi OSIS</h2>
        <p class="text-xs text-center text-slate-400 mb-6">Verifikasi Kehadiran Pengurus OSIS</p>

        <!-- Input Nama -->
        <div class="mb-4">
            <label class="block text-sm font-medium mb-1">Nama Lengkap</label>
            <input type="text" id="namaSiswa" placeholder="Contoh: Arofah Al Hidayah" 
                class="w-full px-4 py-2 rounded-lg bg-slate-900 border border-slate-700 focus:outline-none focus:border-cyan-500">
        </div>

        <!-- Area Kamera -->
        <div class="relative w-full aspect-[3/4] bg-black rounded-xl overflow-hidden mb-4 border border-slate-700">
            <video id="video" autoplay playsinline class="w-full h-full object-cover"></video>
            <canvas id="canvas" class="hidden"></canvas>
            
            <!-- Panduan Wajah -->
            <div class="absolute inset-0 border-4 border-dashed border-cyan-500/40 rounded-xl pointer-events-none flex items-center justify-center">
                <span class="text-xs bg-black/60 px-3 py-1 rounded-full text-cyan-300">Posisikan Wajah di Sini</span>
            </div>
        </div>

        <!-- Tombol Aksi -->
        <button id="btnAbsen" onclick="prosesAbsen()" 
            class="w-full py-3 bg-cyan-600 hover:bg-cyan-500 font-semibold rounded-xl transition duration-200 shadow-lg shadow-cyan-900/50">
            Ambil Foto & Absen Sekarang
        </button>

        <p id="statusText" class="text-center text-xs mt-4 text-slate-400"></p>
    </div>

    <!-- Firebase SDK (Modular v10) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";

        // Konfigurasi Firebase dari project Anda
        const firebaseConfig = {
          apiKey: "AIzaSyAjtOqJNJ2i52CQN72N4FikOWkHa4u0WH8",
          authDomain: "attendance-349b4.firebaseapp.com",
          projectId: "attendance-349b4",
          storageBucket: "attendance-349b4.firebasestorage.app",
          messagingSenderId: "526912530111",
          appId: "1:526912530111:web:ba1de645ca3a637047080a",
          measurementId: "G-NS74HLX3M8"
        };

        // Inisialisasi Firebase & Analytics
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const analytics = getAnalytics(app);

        // Nyalakan Kamera Depan HP
        const video = document.getElementById('video');
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
            .then(stream => { video.srcObject = stream; })
            .catch(err => { alert("Gagal mengakses kamera: " + err); });

        window.prosesAbsen = async function() {
            const nama = document.getElementById('namaSiswa').value.trim();
            const statusText = document.getElementById('statusText');

            if (!nama) {
                alert("Mohon masukkan nama Anda terlebih dahulu!");
                return;
            }

            statusText.innerText = "Memproses verifikasi kehadiran...";

            const canvas = document.getElementById('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            const imageBase64 = canvas.toDataURL('image/jpeg', 0.7);

            try {
                // Simpan data ke Firestore (Koleksi: absensi_osis)
                await addDoc(collection(db, "absensi_osis"), {
                    nama: nama,
                    waktu: new Date().toLocaleString('id-ID', { timeZone: 'Asia/Jakarta' }),
                    timestamp: Date.now()
                });

                statusText.innerText = "✅ Absensi Berhasil Tercatat!";
                statusText.className = "text-center text-xs mt-4 text-emerald-400 font-medium";
                document.getElementById('namaSiswa').value = "";
            } catch (e) {
                statusText.innerText = "❌ Gagal menyimpan: " + e.message;
                statusText.className = "text-center text-xs mt-4 text-rose-400";
            }
        };
    </script>
</body>
</html>
