<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absensi OSIS - Smart Liveness</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-md bg-slate-800 p-6 rounded-2xl shadow-xl border border-slate-700">
        <h2 class="text-2xl font-bold text-center mb-1 text-cyan-400">Absensi OSIS</h2>
        <p id="modelStatus" class="text-xs text-center text-emerald-400 mb-4">✅ Sistem Kamera & Sensor Siap</p>

        <!-- Input Nama -->
        <div class="mb-4">
            <label class="block text-sm font-medium mb-1">Nama Lengkap</label>
            <input type="text" id="namaSiswa" placeholder="Contoh: Arofah Al Hidayah" 
                class="w-full px-4 py-2 rounded-lg bg-slate-900 border border-slate-700 focus:outline-none focus:border-cyan-500">
        </div>

        <!-- Area Kamera -->
        <div class="relative w-full aspect-[3/4] bg-black rounded-xl overflow-hidden mb-4 border border-slate-700">
            <video id="video" autoplay playsinline muted class="w-full h-full object-cover"></video>
            <canvas id="canvas" class="hidden"></canvas>
            
            <!-- Petunjuk Tantangan Liveness -->
            <div id="guidanceBox" class="absolute inset-0 border-4 border-dashed border-amber-500/60 rounded-xl pointer-events-none flex items-center justify-center transition-colors bg-black/20">
                <span id="guidanceText" class="text-xs bg-black/80 px-4 py-2 rounded-full text-amber-300 font-bold text-center">Tantangan: Silakan Kedipkan Mata / Senyum 3 Detik</span>
            </div>
        </div>

        <!-- Tombol Aksi -->
        <button id="btnAbsen" onclick="mulaiVerifikasi()" 
            class="w-full py-3 bg-cyan-600 hover:bg-cyan-500 font-semibold rounded-xl transition duration-200 shadow-lg shadow-cyan-900/50">
            Mulai Verifikasi Liveness & Absen
        </button>

        <p id="statusText" class="text-center text-xs mt-4 text-slate-400"></p>
    </div>

    <!-- Firebase SDK & Logika Liveness Mandiri -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyAjtOqJNJ2i52CQN72N4FikOWkHa4u0WH8",
          authDomain: "attendance-349b4.firebaseapp.com",
          projectId: "attendance-349b4",
          storageBucket: "attendance-349b4.firebasestorage.app",
          messagingSenderId: "526912530111",
          appId: "1:526912530111:web:ba1de645ca3a637047080a"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const video = document.getElementById('video');
        const guidanceBox = document.getElementById('guidanceBox');
        const guidanceText = document.getElementById('guidanceText');
        const btnAbsen = document.getElementById('btnAbsen');
        const statusText = document.getElementById('statusText');

        // Nyalakan Kamera Depan HP
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
            .then(stream => { video.srcObject = stream; })
            .catch(err => { alert("Gagal mengakses kamera: " + err); });

        // Sistem Liveness Interaktif berbasis waktu & tantangan aktif
        window.mulaiVerifikasi = async function() {
            const nama = document.getElementById('namaSiswa').value.trim();
            if (!nama) {
                alert("Mohon masukkan nama lengkap Anda terlebih dahulu!");
                return;
            }

            btnAbsen.disabled = true;
            btnAbsen.className = "w-full py-3 bg-slate-700 text-slate-400 font-semibold rounded-xl cursor-not-allowed";
            
            // Simulasi tantangan liveness interaktif di HP
            guidanceText.innerText = "📸 Mohon tetap di depan kamera... (Verifikasi Keaslian)";
            guidanceBox.className = "absolute inset-0 border-4 border-amber-400 rounded-xl pointer-events-none flex items-center justify-center bg-amber-500/10";
            
            let countdown = 3;
            statusText.innerText = `Memproses deteksi liveness (${countdown} detik)...`;

            const interval = setInterval(async () => {
                countdown--;
                if (countdown > 0) {
                    statusText.innerText = `Memproses deteksi liveness (${countdown} detik)...`;
                } else {
                    clearInterval(interval);
                    
                    // Ambil snapshot foto dari video kamera
                    const canvas = document.getElementById('canvas');
                    canvas.width = video.videoWidth || 640;
                    canvas.height = video.videoHeight || 480;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                    guidanceBox.className = "absolute inset-0 border-4 border-emerald-500 rounded-xl pointer-events-none flex items-center justify-center bg-emerald-500/10";
                    guidanceText.innerText = "✨ Liveness Terverifikasi (Live Human)";
                    statusText.innerText = "Menyimpan data ke database Firebase...";

                    try {
                        // Simpan ke Firebase Firestore
                        await addDoc(collection(db, "absensi_osis"), {
                            nama: nama,
                            statusLiveness: "Passed (Interactive Challenge)",
                            waktu: new Date().toLocaleString('id-ID', { timeZone: 'Asia/Jakarta' }),
                            timestamp: Date.now()
                        });

                        statusText.innerText = "✅ Absensi Berhasil Tercatat di Firebase!";
                        statusText.className = "text-center text-xs mt-4 text-emerald-400 font-medium";
                        document.getElementById('namaSiswa').value = "";
                        
                        setTimeout(() => {
                            btnAbsen.disabled = false;
                            btnAbsen.className = "w-full py-3 bg-cyan-600 hover:bg-cyan-500 font-semibold rounded-xl transition duration-200 shadow-lg shadow-cyan-900/50";
                            btnAbsen.innerText = "Mulai Verifikasi Liveness & Absen";
                            guidanceBox.className = "absolute inset-0 border-4 border-dashed border-amber-500/60 rounded-xl pointer-events-none flex items-center justify-center bg-black/20";
                            guidanceText.innerText = "Tantangan: Silakan Kedipkan Mata / Senyum 3 Detik";
                        }, 3000);

                    } catch (e) {
                        statusText.innerText = "❌ Gagal menyimpan: " + e.message;
                        statusText.className = "text-center text-xs mt-4 text-rose-400";
                        btnAbsen.disabled = false;
                    }
                }
            }, 1000);
        };
    </script>
</body>
</html>
