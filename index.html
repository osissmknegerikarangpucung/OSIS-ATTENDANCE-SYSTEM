<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absensi OSIS - Face Liveness Detection</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Masukkan Pustaka face-api.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.min.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-md bg-slate-800 p-6 rounded-2xl shadow-xl border border-slate-700">
        <h2 class="text-2xl font-bold text-center mb-1 text-cyan-400">Absensi OSIS</h2>
        <p id="modelStatus" class="text-xs text-center text-amber-400 mb-4">Memuat model AI wajah...</p>

        <!-- Input Nama -->
        <div class="mb-4">
            <label class="block text-sm font-medium mb-1">Nama Lengkap</label>
            <input type="text" id="namaSiswa" placeholder="Contoh: Arofah Al Hidayah" 
                class="w-full px-4 py-2 rounded-lg bg-slate-900 border border-slate-700 focus:outline-none focus:border-cyan-500">
        </div>

        <!-- Area Kamera -->
        <div class="relative w-full aspect-[3/4] bg-black rounded-xl overflow-hidden mb-4 border border-slate-700">
            <video id="video" autoplay playsinline muted class="w-full h-full object-cover"></video>
            <canvas id="overlay" class="absolute inset-0 w-full h-full pointer-events-none"></canvas>
            
            <!-- Petunjuk Liveness -->
            <div id="guidanceBox" class="absolute inset-0 border-4 border-dashed border-amber-500/60 rounded-xl pointer-events-none flex items-center justify-center transition-colors">
                <span id="guidanceText" class="text-xs bg-black/70 px-3 py-1.5 rounded-full text-amber-300 font-medium">Tunggu Model Siap...</span>
            </div>
        </div>

        <!-- Tombol Aksi (Disabled sebelum kedip) -->
        <button id="btnAbsen" disabled 
            class="w-full py-3 bg-slate-700 text-slate-400 font-semibold rounded-xl transition duration-200 cursor-not-allowed">
            Silakan Kedipkan Mata Anda Dahulu
        </button>

        <p id="statusText" class="text-center text-xs mt-4 text-slate-400"></p>
    </div>

    <!-- Firebase SDK & Logika Liveness -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyAjtOqJNJ2i52CQN72N4FikOWkHa4u0WH8",
          authDomain: "attendance-349b4.firebaseapp.com",
          projectId: "attendance-349b4",
          storageBucket: "attendance-349b4.firebasestorage.app",
          messagingSenderId: "526912530111",
          appId: "1:526912530111:web:ba1de645ca3a637047080a"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const video = document.getElementById('video');
        const modelStatus = document.getElementById('modelStatus');
        const guidanceBox = document.getElementById('guidanceBox');
        const guidanceText = document.getElementById('guidanceText');
        const btnAbsen = document.getElementById('btnAbsen');
        const statusText = document.getElementById('statusText');

        let isBlinked = false;

        // 1. Load Model Face-Api dari CDN publik
        async function loadModels() {
            try {
                const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
                await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
                await faceapi.nets.faceLandmarkTinyNet.loadFromUri(MODEL_URL);
                
                modelStatus.innerText = "✅ Model AI Siap!";
                modelStatus.className = "text-xs text-center text-emerald-400 mb-4";
                guidanceText.innerText = "Posisikan wajah & kedipkan mata";
                startCamera();
            } catch (err) {
                modelStatus.innerText = "❌ Gagal memuat model AI";
                modelStatus.className = "text-xs text-center text-rose-400 mb-4";
            }
        }

        // 2. Nyalakan Kamera
        function startCamera() {
            navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
                .then(stream => { 
                    video.srcObject = stream; 
                })
                .catch(err => { alert("Gagal mengakses kamera: " + err); });
        }

        // Hitung jarak vertikal mata untuk deteksi kedipan (EAR sederhana)
        function calculateEAR(eye) {
            // eye adalah array titik landmark mata
            const vertical1 = Math.hypot(eye[1].x - eye[5].x, eye[1].y - eye[5].y);
            const vertical2 = Math.hypot(eye[2].x - eye[4].x, eye[2].y - eye[4].y);
            const horizontal = Math.hypot(eye[0].x - eye[3].x, eye[0].y - eye[3].y);
            return (vertical1 + vertical2) / (2.0 * horizontal);
        }

        // 3. Deteksi Wajah & Kedipan Real-time
        video.addEventListener('play', () => {
            const canvas = document.getElementById('overlay');
            const displaySize = { width: video.clientWidth, height: video.clientHeight };
            faceapi.matchDimensions(canvas, displaySize);

            setInterval(async () => {
                if (isBlinked) return; // Jika sudah terverifikasi kedip, hentikan loop deteksi

                const detections = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks(true);

                if (detections) {
                    const landmarks = detections.landmarks;
                    const leftEye = landmarks.getLeftEye();
                    const rightEye = landmarks.getRightEye();

                    const leftEAR = calculateEAR(leftEye);
                    const rightEAR = calculateEAR(rightEye);
                    const avgEAR = (leftEAR + rightEAR) / 2;

                    // Ambang batas kedip (jika EAR di bawah 0.22, mata dianggap menutup)
                    if (avgEAR < 0.22) {
                        isBlinked = true;
                        guidanceBox.className = "absolute inset-0 border-4 border-emerald-500 rounded-xl pointer-events-none flex items-center justify-center transition-colors bg-emerald-500/10";
                        guidanceText.innerText = "✨ Kedipan Terdeteksi!";
                        guidanceText.className = "text-xs bg-emerald-900/80 px-3 py-1.5 rounded-full text-emerald-200 font-bold";

                        // Aktifkan tombol absen
                        btnAbsen.disabled = false;
                        btnAbsen.className = "w-full py-3 bg-cyan-600 hover:bg-cyan-500 font-semibold rounded-xl transition duration-200 shadow-lg shadow-cyan-900/50 cursor-pointer";
                        btnAbsen.innerText = "Kirim Absensi Sekarang";
                    }
                }
            }, 300);
        });

        // 4. Proses Kirim ke Firebase saat tombol diklik
        window.prosesAbsen = async function() {
            const nama = document.getElementById('namaSiswa').value.trim();
            if (!nama) {
                alert("Mohon masukkan nama lengkap Anda terlebih dahulu!");
                return;
            }

            if (!isBlinked) {
                alert("Lakukan verifikasi kedip mata terlebih dahulu!");
                return;
            }

            statusText.innerText = "Mengirim data absensi ke database...";

            try {
                await addDoc(collection(db, "absensi_osis"), {
                    nama: nama,
                    statusLiveness: "Verified (Blink Detected)",
                    waktu: new Date().toLocaleString('id-ID', { timeZone: 'Asia/Jakarta' }),
                    timestamp: Date.now()
                });

                statusText.innerText = "✅ Absensi dengan Liveness Berhasil Dicatat!";
                statusText.className = "text-center text-xs mt-4 text-emerald-400 font-medium";
                document.getElementById('namaSiswa').value = "";
                btnAbsen.disabled = true;
                btnAbsen.className = "w-full py-3 bg-slate-700 text-slate-400 font-semibold rounded-xl cursor-not-allowed";
                btnAbsen.innerText = "Absensi Selesai";
            } catch (e) {
                statusText.innerText = "❌ Gagal menyimpan: " + e.message;
                statusText.className = "text-center text-xs mt-4 text-rose-400";
            }
        };

        // Jalankan pemuatan model saat halaman dibuka
        loadModels();
    </script>
</body>
</html>
